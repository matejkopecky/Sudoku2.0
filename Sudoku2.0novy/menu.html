<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu – Logické hry</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/menu-new.css">
<script src="assets/theme.js" defer></script>
<script src="assets/menu-new.js" defer></script>
</head>
<body>
<div id="menuBackground">
<header class="top">
  <a class="brand" href="menu.html"><span class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></span><span class="brand-text"><span class="brand-name">LOGICKÉ HRY</span><span class="brand-sub">od Matěje Kopeckého</span></span></a>
  <nav><span class="user-chip"><strong>Hráč</strong> · režim offline</span><a href="top10.html">Žebříčky</a><div class="theme-dots" aria-label="Přepnutí barevného režimu"><button type="button" class="theme-dot theme-dot-dark" data-theme-choice="tmavy" title="Tmavý režim"><span>Tmavý</span></button><button type="button" class="theme-dot theme-dot-blue" data-theme-choice="modry" title="Modrý režim"><span>Modrý</span></button><button type="button" class="theme-dot theme-dot-light" data-theme-choice="svetly" title="Světlý režim"><span>Světlý</span></button></div></nav>
</header>
<main class="container menu-home">
  <div class="menu-intro"><span class="badge">Vaše herní centrum</span><h1>Co chcete dělat?</h1><p>Vyberte si hru, vytvořte vlastní hádanku nebo prozkoumejte výsledky.</p></div>
  <section class="menu-tiles" aria-label="Hlavní nabídka">
    <button class="menu-tile" type="button" data-open="games" aria-haspopup="dialog">
      <span class="menu-tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9h11a4 4 0 0 1 3.9 3l1 4a2.8 2.8 0 0 1-4.5 2.8L15 16H9l-2.9 2.8A2.8 2.8 0 0 1 1.6 16l1-4a4 4 0 0 1 3.9-3Z"/><path d="M7 11v5M4.5 13.5h5M16 12h.01M19 14h.01"/></svg></span>
      <strong>Hry</strong><span>Singleplayer a multiplayer</span><span class="tile-link">Vybrat režim →</span>
    </button>
    <button class="menu-tile" type="button" data-open="create" aria-haspopup="dialog">
      <span class="menu-tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5 5 5M4 20l4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z"/></svg></span>
      <strong>Vytvořit</strong><span>Vlastní Sudoku nebo Nonogram</span><span class="tile-link">Otevřít nabídku →</span>
    </button>
    <button class="menu-tile" type="button" data-open="more" aria-haspopup="dialog">
      <span class="menu-tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V9M12 19V5M19 19v-8M3 19h18"/></svg></span>
      <strong>Další</strong><span>Žebříčky, pravidla a informace</span><span class="tile-link">Zobrazit →</span>
    </button>
  </section>
</main>
<footer class="site-footer">Vytvořil: Matěj Kopecký &lt;matysek.kopecky@seznam.cz&gt;</footer>
</div>
<div id="menuOverlay" class="menu-overlay" hidden>
  <div class="menu-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <button type="button" id="closeMenu" class="menu-close" aria-label="Zavřít nabídku">×</button>
    <button type="button" id="backMenu" class="menu-back" hidden>← Zpět</button>
    <h2 id="dialogTitle">Hry</h2>
    <p id="dialogDescription" class="dialog-description">Vyberte si režim.</p>
    <div id="dialogOptions" class="dialog-options"></div>
  </div>
</div>
</body>
</html>
